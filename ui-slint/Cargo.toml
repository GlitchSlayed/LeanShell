[package]
name = "leanshell-ui-slint"
version = "0.0.4"
edition = "2024"
description = "Slint UI toolkit renderer backend for LeanShell"
license = "MIT"
authors = ["Sumir Seth", "LeanShell Contributors"]

[features]
default = ["renderer-skia"]
renderer-skia = ["slint/renderer-skia"]
renderer-vello = ["slint/renderer-vello"]
renderer-software = ["slint/renderer-software"]

[dependencies]
leanshell-core = { path = "../core" }
leanshell-platform-win = { path = "../platform-win" }
leanshell-render = { path = "../render" }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-default"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
] }

[build-dependencies]
slint-build = "1.18"
