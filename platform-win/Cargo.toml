[package]
name = "leanshell-platform-win"
version = "0.0.1"
edition = "2024"
description = "Native Win32 platform integration, AppBar, hooks, and tray host for LeanShell"
license = "MIT"
authors = ["Sumir Seth", "LeanShell Contributors"]

[dependencies]
leanshell-core = { path = "../core" }
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
