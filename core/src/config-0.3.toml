# Values for keys missing from config.toml that differ from
# default-config.toml. A config from Wisp 0.3 has no dock keys, and it keeps
# the taskbar and the centered launcher. Wisp and wisp-settings both read this
# file, so they agree on what such a config means.
position = "center"
dock = false
hide_taskbar = false
shell_mode = "companion"
display_mode = "dock"
panel_edge = "bottom"
watchdog = true
claim_win_key = true
backend = "direct2d"
slint_renderer = "skia"

