name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the Rust version.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Package
        shell: pwsh
        run: |
          $name = "wisp-${{ github.ref_name }}-x86_64-windows"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/wisp.exe, target/release/wisp-settings.exe, README.md, LICENSE $name
          Compress-Archive $name "$name.zip"
          Copy-Item target/release/wisp.exe "wisp-${{ github.ref_name }}-x86_64.exe"
          # The settings app's updater downloads the two .exe files and checks them against SHA256SUMS.txt.
          Copy-Item target/release/wisp-settings.exe "wisp-settings-${{ github.ref_name }}-x86_64.exe"
          $files = "$name.zip", "wisp-${{ github.ref_name }}-x86_64.exe", "wisp-settings-${{ github.ref_name }}-x86_64.exe"
          $files | ForEach-Object { (Get-FileHash $_ -Algorithm SHA256).Hash + "  $_" } | Out-File -Encoding ascii SHA256SUMS.txt
      # The notes are the version's section of CHANGELOG.md, followed by the
      # pull requests GitHub lists for the release (.github/release.yml).
      - name: Notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $section = [regex]::Match((Get-Content CHANGELOG.md -Raw),
            "(?ms)^## $([regex]::Escape($version))\b[^\n]*\n(.*?)(?=^## |\z)").Groups[1].Value.Trim()
          if (-not $section) { throw "CHANGELOG.md has no section for $version" }
          $pulls = gh api "repos/${{ github.repository }}/releases/generate-notes" `
            -f tag_name="${{ github.ref_name }}" --jq .body
          $pulls = $pulls -join "`n"
          "$section`n`n<details>`n<summary>Pull requests</summary>`n`n$pulls`n`n</details>`n" |
            Out-File -Encoding utf8 notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "wisp-${{ github.ref_name }}-x86_64-windows.zip" `
            "wisp-${{ github.ref_name }}-x86_64.exe" `
            "wisp-settings-${{ github.ref_name }}-x86_64.exe" `
            SHA256SUMS.txt `
            --title "Wisp ${{ github.ref_name }}" --notes-file notes.md
