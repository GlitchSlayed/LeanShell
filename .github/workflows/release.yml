name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the Rust version.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Package
        shell: pwsh
        run: |
          $name = "leanshell-${{ github.ref_name }}-x86_64-windows"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/leanshell.exe, target/release/leanshell-settings.exe, README.md, LICENSE $name
          Compress-Archive "$name/*" "$name.zip"
          # Standalone exes are for built-in updaters and direct execution.
          Copy-Item target/release/leanshell.exe "leanshell-${{ github.ref_name }}-x86_64.exe"
          Copy-Item target/release/leanshell-settings.exe "leanshell-settings-${{ github.ref_name }}-x86_64.exe"
          $files = "$name.zip", "leanshell-${{ github.ref_name }}-x86_64.exe", "leanshell-settings-${{ github.ref_name }}-x86_64.exe"
          $files | ForEach-Object { (Get-FileHash $_ -Algorithm SHA256).Hash + "  $_" } | Out-File -Encoding ascii SHA256SUMS.txt
      - name: Generate package manifests
        shell: pwsh
        run: |
          ./packaging/winget/generate.ps1 -Tag "${{ github.ref_name }}" `
            -ZipPath "leanshell-${{ github.ref_name }}-x86_64-windows.zip" -OutputDirectory manifests
      - name: Upload package manifests
        uses: actions/upload-artifact@v4
        with:
          name: package-manifests-${{ github.ref_name }}
          path: manifests/
          if-no-files-found: error
      # The notes start with the download, then the version's CHANGELOG.md section and the
      # pull requests GitHub lists for the release (.github/release.yml).
      - name: Notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $section = [regex]::Match((Get-Content CHANGELOG.md -Raw),
            "(?ms)^## $([regex]::Escape($version))\b[^\n]*\n(.*?)(?=^## |\z)").Groups[1].Value.Trim()
          if (-not $section) { throw "CHANGELOG.md has no section for $version" }
          $pulls = gh api "repos/${{ github.repository }}/releases/generate-notes" `
            -f tag_name="${{ github.ref_name }}" --jq .body
          $pulls = $pulls -join "`n"
          $download = '**Download `leanshell-${{ github.ref_name }}-x86_64-windows.zip`**, extract it and run `leanshell.exe`.'
          "$download`n`n$section`n`n<details>`n<summary>Pull requests</summary>`n`n$pulls`n`n</details>`n" |
            Out-File -Encoding utf8 notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          gh release create "${{ github.ref_name }}" `
            "leanshell-${{ github.ref_name }}-x86_64-windows.zip" `
            "leanshell-${{ github.ref_name }}-x86_64.exe" `
            "leanshell-settings-${{ github.ref_name }}-x86_64.exe" `
            SHA256SUMS.txt `
            --title "$version early experimental" --notes-file notes.md
