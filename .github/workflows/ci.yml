name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the Rust version.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Nightly names and the perf-trace hooks compile only with these features.
      - run: cargo clippy --workspace --all-targets --features leanshell/nightly,leanshell-settings/nightly,leanshell/perf-trace -- -D warnings
      - run: cargo test --workspace
