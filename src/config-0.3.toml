# Values for keys missing from config.toml that differ from
# default-config.toml. A config from Wisp 0.3 has no dock keys, and it keeps
# the taskbar and the centered launcher. Wisp and wisp-settings both read this
# file, so they agree on what such a config means.
position = "center"
dock = false
shell_mode = "exclusive"
display_mode = "dock"
panel_edge = "bottom"
panel_align = "center"
watchdog = true
claim_win_key = true
neuter_shell_hosts = true
auto_reap_explorer = true
claim_shell_chords = true
wm_enabled = true
wm_tiling = false
wm_gap = 8
wm_borders = true
wm_border_color = "#0891B2"
auto_update = "auto"
update_check_hours = 6

